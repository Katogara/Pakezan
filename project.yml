# XcodeGen プロジェクト定義 (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate
name: Pakezan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # 日本語を文節の切れ目で折り返す (Google の BudouX の Swift 版)
  BudouX:
    url: https://github.com/griffin-stewie/BudouX.swift
    exactVersion: 0.10.0
targets:
  Pakezan:
    type: application
    platform: iOS
    dependencies:
      - package: BudouX
    sources:
      - path: Pakezan
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Pakezan
        INFOPLIST_FILE: Pakezan/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  PakezanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PakezanTests
    dependencies:
      - target: Pakezan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pakezan:
    build:
      targets:
        Pakezan: all
    test:
      targets:
        - PakezanTests
