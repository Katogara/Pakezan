name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))
          ")
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Pakezan.xcodeproj \
            -scheme Pakezan \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        run: |
          xcodebuild build \
            -project Pakezan.xcodeproj \
            -scheme Pakezan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pakezan.app Payload/
          zip -qr Pakezan.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pakezan-unsigned-ipa
          path: Pakezan.ipa
          retention-days: 30
